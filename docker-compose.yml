services:
  pioneer-remote:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pioneer-remote
    restart: unless-stopped
    networks:
      - default
    ports:
      - "${PORT:?Set PORT in .env}:8099"
    environment:
      PIONEER_IP: ${PIONEER_IP:?Set PIONEER_IP in .env}
      PIONEER_PORT: ${PIONEER_PORT:?Set PIONEER_PORT in .env}
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8099/health')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  default:
    name: ${DEPLOYMENT_NET:-${COMPOSE_PROJECT_NAME:-pioneerremote}_default}
    external: ${DEPLOYMENT_NET_EXTERNAL:-false}
