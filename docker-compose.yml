services:
  pioneer-remote:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pioneer-remote
    restart: unless-stopped
    networks:
      - default
      - proxy-net
    ports:
      - "8099:8099"
    environment:
      - PIONEER_IP=10.1.1.199
      - PIONEER_PORT=8102
      - PORT=8099
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8099/health')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  proxy-net:
    external: true
